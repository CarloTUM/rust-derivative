on: [push, pull_request]

name: Continuous integration

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - 1.85.0
          - stable
          - beta
          - nightly
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo check

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-22.04
          - macos-latest
          - windows-latest
        rust:
          - 1.85.0
          - stable
          - beta
          - nightly
        features:
          - ''
          - 'use_core'
        extra_args:
          - ''
        include:
          # The compiler output isn't stable from one version to another of rustc, so we only
          # test that on one version
          - os: ubuntu-22.04
            rust: 1.85.0
            features: ''
            extra_args: ''
          - os: ubuntu-22.04
            rust: 1.85.0
            features: ''
            extra_args:  'compile_test -- --ignored'
          - os: ubuntu-22.04
            rust: 1.85.0
            features: 'use_core'
            extra_args: ''
          - os: ubuntu-22.04
            rust: 1.85.0
            features: 'use_core'
            extra_args: 'compile_test -- --ignored'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo test --features=${{ matrix.features }} ${{ matrix.extra_args }}
        env:
          RUST_BACKTRACE: 1
      # mdbook's dependencies require a newer rustc than our MSRV, so build it
      # with stable. `mdbook test` itself still uses the matrix toolchain.
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable install mdbook --no-default-features --features search --vers "^0.4.0"
      - run: mdbook build
      # Stable cargo puts the proc-macro in `deps/`, nightly cargo (new build-dir
      # layout) only in `debug/` itself, so search both.
      - run: mdbook test -L ./target/debug/deps/ -L ./target/debug/
        if: matrix.features != 'use_core'

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - 1.85.0
          - stable
        features:
          - ''
          - 'use_core'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy
      - run: cargo clippy --all-targets --features=${{ matrix.features }} -- -D warnings
